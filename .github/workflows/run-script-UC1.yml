name: Run UC1 script

on:
  schedule:
    - cron: '0 0 15 * *' # 00:00 UTC on the 15th = 08:00 SGT
  workflow_dispatch:

env:
  # Run as a module so `from engines.result import StageResult` works.
  # If you rename the file, update this line only.
  SCRIPT_MODULE: engines.uc1.arm_jeremiahVer

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install psycopg2-binary python-dotenv mlxtend pandas numpy scipy

      - name: Create .env.local
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.local

      - name: Run the script
        run: python -m ${{ env.SCRIPT_MODULE }}